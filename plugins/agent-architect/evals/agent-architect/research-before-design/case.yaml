schema_version: "1.1"
name: research-before-design
description: The research plugin is not loaded in an eval run, so this tests only that research is proposed before the design, not a real dispatch. The run has no repo, so the repo context is in the prompt.
expected_outcome: |
  agent-architect proposes a research step, with a note on its quota cost, and waits for the user before writing a design.
