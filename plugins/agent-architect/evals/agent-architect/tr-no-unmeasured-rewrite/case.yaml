schema_version: "1.1"
name: tr-no-unmeasured-rewrite
description: The failure this guards against is an agent rewriting its own prompt with no measurement. The run has no repo, so the skill's text is pasted into the prompt.
expected_outcome: |
  agent-architect does not rewrite SKILL.md. It asks for evidence of what is wrong, or proposes eval cases to measure first.
